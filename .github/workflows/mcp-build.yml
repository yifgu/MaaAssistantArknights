name: Battle MCP Bundle

on:
  push:
    branches:
      - "dev-v2"
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/mcp-build.yml"
      - ".github/workflows/mcp-platform.yml"
      - ".github/workflows/mcp-core.yml"
      - ".github/workflows/native-build.yml"
      - ".github/actions/setup-maadeps/**"
      - "3rdparty/include/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "include/**"
      - "src/**"
      - "tools/**"
      - "resource/**/inference.onnx"
      - "resource_android/**"
      - "!**/*.md"
  workflow_call:
    inputs:
      ref:
        description: "Source revision; defaults to the calling workflow's commit"
        type: string
        default: ""
      configuration:
        description: "Bundle configuration; Debug is always tested before upload"
        type: string
        default: RelWithDebInfo
      platform:
        description: "Target platform: all, win-x64, or linux-x64"
        type: string
        default: all
      runtime_artifact:
        description: "Same-run native runtime (requires a single platform and matching core_version)"
        type: string
        default: ""
      core_version:
        description: "Explicit shared Core version; standalone builds use the source commit"
        type: string
        default: ""
      phase:
        description: "Internal fan-out/fan-in: all, prepare (tests), or bundle (requires a successful same-run test receipt)"
        type: string
        default: all
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [RelWithDebInfo, Debug]
        default: RelWithDebInfo
      platform:
        type: choice
        options: [all, win-x64, linux-x64]
        default: all

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source revision and build mode
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Validate reusable workflow inputs
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          CONFIGURATION: ${{ inputs.configuration || 'RelWithDebInfo' }}
          PHASE: ${{ inputs.phase || 'all' }}
          RUNTIME_ARTIFACT: ${{ inputs.runtime_artifact }}
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          case "$PLATFORM" in all|win-x64|linux-x64) ;; *) exit 1 ;; esac
          case "$CONFIGURATION" in Debug|RelWithDebInfo) ;; *) exit 1 ;; esac
          case "$PHASE" in all|prepare|bundle) ;; *) exit 1 ;; esac
          if [[ -n "$RUNTIME_ARTIFACT" && ( "$PLATFORM" == all || -z "$CORE_VERSION" ) ]]; then
            echo "::error::A shared runtime requires a single platform and an explicit Core version"
            exit 1
          fi
          if [[ "$PHASE" == bundle && "$CONFIGURATION" != Debug && -z "$RUNTIME_ARTIFACT" ]]; then
            echo "::error::Bundle-only assembly requires the completed same-run release runtime"
            exit 1
          fi

      - name: Resolve source ref once for all parallel jobs
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: .github/workflows
          show-progress: false
          persist-credentials: false

  build:
    name: Build and test (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((inputs.platform || 'all') == 'all' && '["win-x64","linux-x64"]' || format('["{0}"]', inputs.platform)) }}
    uses: ./.github/workflows/mcp-platform.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      configuration: ${{ inputs.configuration || 'RelWithDebInfo' }}
      platform: ${{ matrix.platform }}
      runtime_artifact: ${{ inputs.runtime_artifact || '' }}
      core_version: ${{ inputs.core_version || '' }}
      phase: ${{ inputs.phase || 'all' }}
